name: tests

on:
  push:
  pull_request:

jobs:
  portable-pipeline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: rjbench-verify
      - run: >-
          rjbench-run --backend mock --model ci-mock
          --data data/smoke/smoke_prompts.jsonl --max-samples 2
          --attacks A0_direct --scenarios S1_direct
          --defenses D0_none,D1_system_prompt
          --output runs/ci_smoke.jsonl --no-resume

